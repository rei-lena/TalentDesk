<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentDesk – Recruiting workbench</title>
<meta name="theme-color" content="#1d1e22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f7fe6'/%3E%3Cstop offset='1' stop-color='%232a55c0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ETD%3C/text%3E%3C/svg%3E">
<style>:root{
  color-scheme: light;
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#fafaf8; --surface-3:#f0efec;
  --border:#e6e5e1; --border-strong:#d2d1cc;
  --text:#1b1b1a; --text-2:#52514e; --text-3:#85847e;
  --accent:#2a63d4; --accent-hover:#2153b8; --accent-soft:#eaf0fc; --accent-ink:#1c4aa3;
  --good:#0b7a3b; --good-bg:#e6f5ec; --warn:#8a5300; --warn-bg:#fff3d6; --bad:#b42f2f; --bad-bg:#fdeaea;
  --violet:#5b4bc4; --violet-bg:#efedfb;
  --series-1:#2a78d6;
  --radius:8px; --shadow:0 1px 2px rgba(20,20,15,.06),0 2px 8px rgba(20,20,15,.05);
  --shadow-lg:0 12px 40px rgba(20,20,15,.18);
  --font: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:18px} h2{font-size:15px} h3{font-size:13px}
.muted{color:var(--text-3)} .sec{color:var(--text-2)}
.small{font-size:12px} .tiny{font-size:11px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}

/* layout */
#app{display:grid;grid-template-columns:216px 1fr;height:100vh}
.sidebar{background:#1d1e22;color:#d9d9de;display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;color:#fff;font-weight:650;font-size:14px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f7fe6,#2a55c0);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;color:#c4c4cb;cursor:pointer;text-align:left}
.nav-btn:hover{background:#2a2b31;color:#fff}
.nav-btn.active{background:#31333b;color:#fff}
.nav-btn svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-badge{margin-left:auto;background:#3a3d47;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
.nav-badge.hot{background:#2a63d4}
.nav-sep{height:1px;background:#2e2f35;margin:10px 4px}
.side-foot{margin-top:auto;padding:10px 8px 2px;font-size:11.5px;color:#9a9aa3;display:flex;flex-direction:column;gap:8px}
.side-foot .backup{display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid #33343b;border-radius:6px;padding:6px 8px;background:none;color:#c4c4cb;text-align:left;width:100%}
.side-foot .backup svg{width:14px;height:14px;flex:none}
.side-foot .backup:hover{border-color:#4a4b55;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#5bbf7a;flex:none}
.dot.warn{background:#e8a33a}

main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);min-height:56px}
.topbar h1{white-space:nowrap}
#view{flex:1;min-height:0;overflow:auto}
.page{padding:18px 20px 60px;max-width:1280px}
.page.full{max-width:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;line-height:20px}
.btn:hover{background:var(--surface-3)}
.btn:focus-visible,.input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg);border-color:#f0c4c4}
.btn.sm{padding:2px 8px;font-size:12px;line-height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.input,select.input,textarea.input{border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;background:var(--surface);min-width:0;line-height:20px}
textarea.input{resize:vertical;line-height:1.45;width:100%}
.input.sm{padding:2px 7px;font-size:12px}
.input.flat{border-color:transparent;background:transparent;padding:3px 6px;width:100%}
.input.flat:hover{border-color:var(--border)}
.input.flat:focus{border-color:var(--border-strong);background:var(--surface)}
.search{position:relative}
.search input{padding-left:28px;width:240px}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2);font-weight:500}
label.field .input{font-weight:400;color:var(--text)}
.toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.toggle button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;border-right:1px solid var(--border)}
.toggle button:last-child{border-right:0}
.toggle button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);margin:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:0 6px;font-size:11px;line-height:18px;background:var(--surface-3);color:var(--text-2);white-space:nowrap;font-weight:500}
.chip.blue{background:var(--accent-soft);color:var(--accent-ink)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.outline{background:none;border:1px solid var(--border-strong)}
.chip svg{width:11px;height:11px}

/* cards & panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-body{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mt{margin-top:16px} .mt-s{margin-top:8px} .mb{margin-bottom:12px}
.empty{padding:48px 20px;text-align:center;color:var(--text-2)}
.empty h2{margin-bottom:6px;color:var(--text)}
.callout{border:1px solid #cfdcf6;background:#f3f7fe;border-radius:8px;padding:10px 12px;color:#23427f}
.callout.warn{border-color:#f0dca8;background:#fffaeb;color:#6b4500}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}

/* board */
.board{display:flex;gap:10px;padding:14px 20px 80px;align-items:flex-start;min-height:100%}
.col{flex:0 0 264px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:6px;padding:9px 11px;border-bottom:1px solid var(--border);font-weight:600}
.col-head .count{color:var(--text-3);font-weight:500}
.col-body{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:60px}
.col-empty{color:var(--text-3);font-size:12px;text-align:center;padding:14px 4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px 9px;cursor:pointer;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.dragging{opacity:.45}
.card .nm{font-weight:600;padding-right:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.card .pick{position:absolute;top:8px;right:8px;opacity:0;accent-color:var(--accent)}
.card:hover .pick,.card .pick:checked,.board.selecting .card .pick{opacity:1}

/* table */
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface)}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--text-2);padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f8fb}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--surface)}
.tbl-wrap .tbl td:first-child,.tbl-wrap .tbl th:first-child{padding-left:14px}

/* bulk bar */
.bulkbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d1e22;color:#fff;border-radius:10px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);z-index:30}
.bulkbar .btn{background:#2d2f36;border-color:#3d3f48;color:#fff}
.bulkbar .btn:hover{background:#393b44}
.bulkbar select{background:#2d2f36;border:1px solid #3d3f48;color:#fff;border-radius:6px;padding:4px 6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.18);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:var(--surface);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:650;flex:none}
.drawer-body{flex:1;overflow-y:auto;padding:14px 18px 40px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 18px}
.tabs button{border:0;background:none;padding:9px 10px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
dl.kv{display:grid;grid-template-columns:132px 1fr;gap:2px 10px;margin:0;align-items:center}
dl.kv dt{color:var(--text-3);font-size:12px}
dl.kv dd{margin:0;min-width:0}
.section-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;margin:18px 0 8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.timeline li:last-child{border-bottom:0}
.timeline .when{color:var(--text-3);font-size:12px;width:110px;flex:none}
.sc{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.sc dl{display:grid;grid-template-columns:1fr;gap:2px;margin:8px 0 0}
.sc dt{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:6px}
.sc dd{margin:0;white-space:pre-wrap}
.decision{border-radius:8px;padding:10px 12px;margin-top:12px}
.decision.advance{background:var(--good-bg)} .decision.hold{background:var(--warn-bg)} .decision.decline{background:var(--bad-bg)}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(20,20,18,.32);z-index:60;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center}

/* import */
.drop-zone{border:2px dashed var(--border-strong);border-radius:12px;padding:36px;text-align:center;background:var(--surface);cursor:pointer;transition:.15s}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{padding:3px 10px;border-radius:12px;background:var(--surface-3);color:var(--text-3);font-size:12px;font-weight:500}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{background:var(--accent-soft);color:var(--accent-ink)}
.diff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--text-2);font-size:12px}
.stat .h{color:var(--text-3);font-size:11.5px;margin-top:2px}

/* reports */
.bars{display:grid;grid-template-columns:160px 1fr 56px 64px 84px;gap:0;align-items:center}
.bars > div{padding:7px 8px;border-bottom:1px solid var(--border)}
.bars .hd{font-size:11.5px;color:var(--text-2);font-weight:600;background:var(--surface-2)}
.bars .num{text-align:right;font-variant-numeric:tabular-nums}
.bar-track{position:relative;height:16px}
.bar{position:absolute;left:0;top:2px;height:12px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.bar-hit{position:absolute;inset:-6px 0;cursor:default}
#tip{position:fixed;pointer-events:none;background:#1d1e22;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:90;box-shadow:var(--shadow-lg);max-width:260px}

/* storage banner & gate */
.banner{position:relative;z-index:45;display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:12.5px;flex-wrap:wrap}
.banner.warn{background:#fff4d6;color:#5f3d00;border-bottom:1px solid #f0dca8}
.gate{position:fixed;inset:0;background:rgba(29,30,34,.72);z-index:80;display:grid;place-items:center;padding:20px}
.gate-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:28px;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate-card p{margin:0;color:var(--text-2)}
.side-foot a.warnlink{color:#f0c36b}
/* toast */
#toast{position:fixed;bottom:76px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:95}
.toast-item{background:#1d1e22;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow-lg);transition:.3s;display:flex;align-items:center;gap:12px;max-width:420px}
.toast-item.err{background:#8f2424}
.toast-item.out{opacity:0;transform:translateY(8px)}
.toast-item button{background:none;border:1px solid #555;color:#fff;border-radius:5px;padding:1px 8px;cursor:pointer}

.kbd{border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:var(--surface)}
.hm-card{margin-bottom:14px}
.cand-line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.cand-line:last-child{border-bottom:0}
pre.code{white-space:pre-wrap;background:var(--surface-3);border-radius:8px;padding:10px 12px;margin:0;font-size:12px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="brand-mark">TD</div>TalentDesk</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="backup" id="backup-btn" data-act="backup" title="Download a backup of all your data"></button>
      <div id="storage-note"></div>
      <div>Runs offline · no data leaves this computer</div>
    </div>
  </aside>
  <main>
    <div id="banner"></div>
    <header class="topbar"><h1 id="view-title"></h1><span class="spacer"></span><div class="row" id="view-actions"></div></header>
    <div id="view"></div>
  </main>
</div>
<div id="gate-root"></div>
<div id="drawer-root"></div>
<div id="bulk-root"></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<div id="tip" class="hidden" role="tooltip"></div>

rn c.stageId==='offer'||c.stageId==='hired';});\nfunction cand(c,showReq){\n  return '<tr><td><b>'+esc(c.name)+'<\/b><div class=\"sub\">'+esc([c.current,c.location].filter(Boolean).join(' \u00b7 '))+'<\/div><\/td>'+\n    (showReq?'<td class=\"sub\">'+esc(c.req.title||c.req.id)+'<\/td>':'')+\n    '<td>'+(c.rec?'<span class=\"chip '+(c.recCls||'')+'\">Recruiter: '+esc(c.rec)+'<\/span> ':'')+(c.decision?'<span class=\"chip '+esc(c.decisionCls)+'\">You: '+esc(c.decision)+'<\/span> ':'')+(c.waiting?'<span class=\"chip violet\">Waiting on you<\/span>':'')+'<\/td>'+\n    '<td class=\"sub\">'+esc(c.next||'')+'<\/td><td class=\"num sub\">'+(c.closed?'':esc(c.days)+'d')+'<\/td><\/tr>';\n}\nvar h='<div class=\"tiles\"><div class=\"tile\"><div class=\"v\">'+active.length+'<\/div><div class=\"l\">Active candidates<\/div><\/div><div class=\"tile\"><div class=\"v\">'+waiting.length+'<\/div><div class=\"l\">Waiting on your review<\/div><\/div><div class=\"tile\"><div class=\"v\">'+interviewing.length+'<\/div><div class=\"l\">In interviews<\/div><\/div><div class=\"tile\"><div class=\"v\">'+offers.length+'<\/div><div class=\"l\">Offer or hired<\/div><\/div><\/div>';\nif(waiting.length){h+='<section class=\"card wait\"><div class=\"head\"><h2>Waiting on your review ('+waiting.length+')<\/h2><span class=\"sp\"><\/span><span class=\"sub\">Use the review file I sent you to give a decision on each.<\/span><\/div><table><thead><tr><th>Candidate<\/th><th>Role<\/th><th>Notes<\/th><th>Next step<\/th><th class=\"num\">Waiting<\/th><\/tr><\/thead><tbody>'+waiting.map(function(c){return cand(c,true);}).join('')+'<\/tbody><\/table><\/section>';}\nD.reqs.forEach(function(r){\n  var open=r.cands.filter(function(c){return !c.closed;});\n  h+='<section class=\"card\"><div class=\"head\"><h2>'+esc(r.title||r.id)+'<\/h2><span class=\"chip\">'+esc(r.id)+'<\/span><span class=\"sp\"><\/span><div class=\"funnel\">'+r.funnel.map(function(f){return '<span class=\"chip'+(f.n?'':' muted')+'\">'+esc(f.label)+' /* ============================ modals ============================ */
function openModal(title, body, foot, wide) {
  $('#modal-root').innerHTML = `<div class="modal-wrap" data-act="modalBg"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><span class="spacer"></span><button class="btn ghost" data-act="closeModal" aria-label="Close">${icon('x')}</button></div><div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
  const f = $('#modal-root [autofocus]') || $('#modal-root .modal-body input, #modal-root .modal-body textarea, #modal-root .modal-body select'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modal-root').innerHTML = ''; UI.modal = null; }
function confirmBox(msg, ok = 'Confirm', danger = false) {
  return new Promise(res => { UI.modal = { type: 'confirm', res }; openModal('Please confirm', `<p style="margin:0">${msg}</p>`, `<button class="btn" data-act="confirmNo">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="confirmYes" autofocus>${esc(ok)}</button>`); });
}

function defaultTplFor(cands) { const c = cands[0]; const kind = c && c.stage === 'hm_interview' ? 'next' : c && c.inviteSentAt && !c.bookedAt ? 'reminder' : 'invite'; return (S.templates.find(t => t.kind === kind) || S.templates[0] || {}).id; }
function openEmail(ids, tplId) { const cands = ids.map(getCand).filter(Boolean); if (!cands.length) return; UI.modal = { type: 'email', ids: cands.map(c => c.id), tpl: tplId || defaultTplFor(cands), done: new Set() }; renderEmailModal(); }
function renderEmailModal() {
  const m = UI.modal; const t = S.templates.find(x => x.id === m.tpl) || S.templates[0]; if (!t) { toast('Add an email template in Settings first', 'err'); return; }
  const cands = m.ids.map(getCand).filter(Boolean);
  const sel = `<label class="field">Template<select class="input" data-act-change="emailTpl">${S.templates.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`;
  const marks = t.kind === 'invite' ? ' and mark the invite as sent' : '';
  if (cands.length === 1) {
    const c = cands[0];
    openModal(`Email ${candName(c)}`, `<div class="stack">${sel}<label class="field">To<input class="input" value="${esc(c.email || '')}" id="em-to"></label><label class="field">Subject<input class="input" id="em-subj" value="${esc(renderTemplate(t.subject, c))}"></label><label class="field">Message<textarea class="input" id="em-body" rows="12">${esc(renderTemplate(t.body, c))}</textarea></label>
      <label class="chk"><input type="checkbox" id="em-log" checked> Log this on the candidate${marks}</label>${!S.settings.bookingLink && /booking_link/.test(t.body) ? '<div class="callout warn small">Tip: add your booking link in Settings so it fills in automatically.</div>' : ''}</div>`,
      `<button class="btn" data-act="emCopy">${icon('copy')} Copy message</button><button class="btn primary" data-act="emOpen">${icon('mail')} Open in Outlook</button>`);
  } else {
    const noEmail = cands.filter(c => !c.email).length;
    openModal(`Email ${cands.length} candidates`, `<div class="stack">${sel}<p class="sec small" style="margin:0">Each <b>Open</b> starts a personalized Outlook draft. Sending them one by one keeps them personal and logs each candidate${marks}.</p>
      ${noEmail ? `<div class="callout warn small">${plural(noEmail, 'candidate')} have no email address.</div>` : ''}
      <div>${cands.map(c => `<div class="cand-line"><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(candName(c))}</div><div class="muted small">${esc(c.email || 'no email')} · ${esc(c.reqId || '')}</div></div>${m.done.has(c.id) ? '<span class="chip good">Logged</span>' : ''}<button class="btn sm" data-act="emRowCopy" data-id="${c.id}">${icon('copy')}</button><button class="btn sm ${m.done.has(c.id) ? '' : 'primary'}" data-act="emRowOpen" data-id="${c.id}" ${c.email ? '' : 'disabled'}>Open</button></div>`).join('')}</div></div>`,
      `<button class="btn" data-act="bulkCopyEmails">${icon('copy')} Copy all addresses (for BCC)</button><span class="spacer"></span><button class="btn" data-act="emMarkAll">Log all as sent</button><button class="btn primary" data-act="closeModal">Done</button>`, false);
  }
}
function mailto(to, subject, body) { const a = document.createElement('a'); a.href = `mailto:${encodeURIComponent(to || '').replace(/%40/g, '@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.replace(/\r?\n/g, '\r\n'))}`; document.body.appendChild(a); a.click(); a.remove(); }
function recordEmail(c, t) {
  if (!c || !t) return; log(c, 'email', `Email: ${t.name}`);
  if (t.kind === 'invite') { c.inviteSentAt = nowIso(); if (c.stage === 'new') setStage(c, 'screen', 'invite sent'); }
  if (t.kind === 'reminder') c.reminderSentAt = nowIso();
  save();
}

function openBooking(c) {
  const d = new Date(Date.now() + DAY); d.setMinutes(0, 0, 0); d.setHours(10);
  UI.modal = { type: 'booking', cid: c.id };
  openModal('Log screen booking', `<div class="stack"><p class="sec" style="margin:0">When is your call with <b>${esc(candName(c))}</b>?</p><input class="input" type="datetime-local" id="bk-at" value="${toLocalInput(c.bookedAt) || toLocalInput(d.toISOString())}"></div>`,
    `<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveBooking">Save</button>`);
}

/* ============================ reqs & HMs ============================ */

  const hmOpts = sel => `<option value="">— Unassigned —</option>${S.hms.map(h => `<option value="${h.id}" ${h.id === sel ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}`;

/* ============================ import ============================ */
function viewImport() {
  const imp = UI.imp; const step = imp ? imp.step : 1;
  const steps = ['Choose file', 'Map columns', 'Review changes', 'Done'];
  const bar = `<div class="steps">${steps.map((s, i) => `<span class="${i + 1 === step ? 'on' : i + 1 < step ? 'done' : ''}">${i + 1}. ${s}</span>`).join('')}</div>`;
  if (step === 1) return `<div class="page" style="max-width:900px">${bar}
    <label class="drop-zone" id="drop-zone"><input type="file" id="imp-file" accept=".csv,.xlsx,.xlsm,.txt,.tsv" data-act-change="impFile" hidden>
      <div style="font-size:15px;font-weight:600">Drop your Workday export here</div><div class="sec mt-s">or click to choose a file (.xlsx or .csv)</div></label>
    <div class="panel mt"><div class="panel-body"><h3>How to get the export from Workday</h3>
      <ol class="sec" style="margin:8px 0 0;padding-left:18px;line-height:1.7"><li>Open the report or grid you already use to review candidates (for example your <i>Job Requisition → Candidates</i> tab, or a saved report of all your open reqs).</li>
      <li>Click the <b>Export to Excel</b> icon in the top right of the grid. You don't need IT or an integration.</li><li>Drop the file above. The first time you'll confirm which column is which. After that it remembers.</li></ol>
      <p class="sec small" style="margin-top:10px">The best export includes <b>candidate name, email, job requisition, step/disposition</b>, and if possible the <b>candidate or application ID</b> (most reliable for matching). One report across all your reqs is ideal.<br>Re-import every morning. It shows you who's new, who moved in Workday, and who dropped off.</p></div></div>
    ${S.imports.length ? `<div class="panel mt"><div class="panel-head"><h3>Import history</h3></div><table class="tbl"><thead><tr><th>When</th><th>File</th><th class="num">Rows</th><th class="num">New</th><th class="num">Step changed</th><th class="num">Not in export</th></tr></thead><tbody>${S.imports.slice(0, 12).map(i => `<tr><td>${esc(fmtDateTime(i.at))}</td><td>${esc(i.fileName)}</td><td class="num">${i.counts.total}</td><td class="num">${i.counts.new}</td><td class="num">${i.counts.changed}</td><td class="num">${i.counts.missing}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`;
  if (step === 2) {
    const headers = (imp.rows[imp.headerRow] || []).map(h => String(h || '').trim());

        rec: sc ? { label: (RECS.find(x => x.id === sc.recommendation) || {}).label || '', rating: sc.rating || '', fields: S.settings.scorecardFields.filter(f => (sc.fields || {})[f]).map(f => [f, sc.fields[f]]) } : null, resume: files[c.id] || null }; }),
  };
  const html = PACKET_TEMPLATE.replace('__TITLE__', esc(`Candidate review for ${hm.name}`)).replace('__PAYLOAD__', () => JSON.stringify(payload).replace(/</g, '\\u003c'));
  return { payload, html };
}

function statusNext(c) {
  const ss = screenStatus(c); const d = c.hmDecision && c.hmDecision.at >= (c.stageEnteredAt || '') ? DECISIONS[c.hmDecision.decision] : null;
  switch (c.stage) {
    case 'screen': return !ss ? '' : ss.k === 'todo' ? 'Recruiter reaching out' : ss.k === 'invited' ? 'Invited to recruiter screen' : ss.k === 'booked' ? 'Recruiter screen ' + fmtDateTime(c.bookedAt) : 'Screened, write-up coming to you';
    case 'hm_review': return hmPending(c) ? 'Your resume review' : d ? `You chose ${d.label}. Recruiter following up` : '';
    case 'hm_interview': return c.bookedAt && c.bookedAt > (c.stageEnteredAt || '') && Date.parse(c.bookedAt) > Date.now() ? 'Interview with you ' + fmtDateTime(c.bookedAt) : 'Interview with you (scheduling)';
    case 'panel': return 'Panel / onsite';
    case 'offer': return 'Offer in progress';
    case 'hired': return 'Hired';
    default: return '';
  }
}
function buildStatusPage(hm) {
  const reqs = S.reqs.filter(r => r.hmId === hm.id && r.status !== 'closed');

    reqs: reqs.map(r => { const mine = S.candidates.filter(c => c.reqId === r.id);
      return { id: r.id, title: r.title, stages: stages.map(s => ({ id: s.id, label: s.label })),
        funnel: stageList().filter(s => s.id !== 'rejected').map(s => ({ label: s.label, n: mine.filter(c => c.stage === s.id).length })),
        closedCount: mine.filter(c => c.stage === 'rejected').length,
        cands: mine.filter(c => c.stage !== 'new' && c.stage !== 'rejected').map(c => { const sc = latestScorecard(c); const rec = sc && RECS.find(x => x.id === sc.recommendation); const d = c.hmDecision && DECISIONS[c.hmDecision.decision];
          return { name: candName(c), stageId: c.stage, current: [c.currentTitle, c.currentCompany].filter(Boolean).join(' @ '), location: c.location || '', days: daysInStage(c), rec: rec ? rec.label : '', recCls: rec ? rec.cls : '', decision: d ? d.label : '', decisionCls: d ? d.cls : '', waiting: hmPending(c), next: statusNext(c), closed: false }; }) }; }),
  };
  return STATUS_TEMPLATE.replace('__TITLE__', esc(`Hiring pipeline – ${hm.name}`)).replace('__PAYLOAD__', () => JSON.stringify(payload).replace(/</g, '\\u003c'));
}
function downloadStatus(hmId) {

    for (const [k, v] of Object.entries(data.files || {})) { if (v && v.data) await Store.Files.put(metas[k] || { id: k, name: v.name, type: v.type }, dataURLtoBlob(v.data)).catch(() => { }); }
    S = migrate(data.state); S.updatedAt = nowIso(); await Store.persistNow(); await Store.flushFile(true); UI.drawer = null; UI.sel.clear(); toast('Backup restored'); render();

    const si = order.indexOf(stage === 'rejected' ? 'screen' : stage); order.slice(0, si + 1).forEach((s, k) => { c.reached[s] = ago(14 - k * 2); });
    if (stage === 'rejected') { c.reached.rejected = entered; c.rejectReason = ['Comp expectations', 'Candidate withdrew', 'Not a fit: experience'][i % 3]; }

    return c;
  });
  S.hms = [...S.hms.filter(h => !hms.some(x => x.id === h.id)), ...hms]; S.reqs = [...S.reqs.filter(r => !reqs.some(x => x.id === r.id)), ...reqs];

};
const CHANGE = {
  bulkMove: el => { if (el.value) moveMany(selectedIds(), el.value); },
  emailTpl: el => { UI.modal.tpl = el.value; renderEmailModal(); },
  attachResume: async el => { const f = el.files[0]; if (!f) return; if (f.size > 8 * 1024 * 1024) return toast('That file is over 8 MB. Try a smaller PDF.', 'err');
    try { const c = cur(); const meta = { id: uid('f_'), name: f.name, type: f.type || 'application/pdf', size: f.size }; await Store.Files.put(meta, f); if (c.resume) await Store.Files.del(c.resume); c.resume = meta; log(c, 'file', 'Resume attached: ' + f.name); afterCandChange(); toast('Resume attached'); } catch (e) { toast(e.message, 'err'); } },
  impFile: el => handleImportFile(el.files[0]),
  impHeader: el => { const imp = UI.imp; imp.headerRow = Math.max(0, Math.min(imp.rows.length - 1, (+el.value || 1) - 1)); imp.mapping = Parse.guessMapping(imp.rows[imp.headerRow]); render(); },
  impMap: el => { UI.imp.mapping[el.dataset.k] = el.value; if (!el.value) delete UI.imp.mapping[el.dataset.k]; rerender(); },
  impAssign: el => { UI.imp.assignReq = el.value; rerender(); },
  impApply: el => { UI.imp.diff.changed[+el.dataset.i].apply = el.checked; },
  impArchive: el => { UI.imp.diff.archiveMissing = el.checked; },
  reportReq: el => { UI.reportReq = el.value; render(); },
  restore: el => { if (el.files[0]) restoreBackup(el.files[0]); el.value = ''; },
};

/* ============================ event wiring ============================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act === 'open' && e.target.closest('input,select,button:not([data-act="open"]),a:not([data-act="open"])') && e.target.closest('[data-act]') !== el) return;
  fn(el, e);
});
const searchDebounced = debounce(() => renderResults(), 120);
document.addEventListener('input', e => { const el = e.target; if (el.dataset.ui === 'search') { UI.search = el.value; searchDebounced(); } });
document.addEventListener('change', e => {
  const el = e.target; const d = el.dataset;
  if (d.actChange && CHANGE[d.actChange]) return CHANGE[d.actChange](el, e);
  if (d.ui && d.ui !== 'search') { UI[d.ui] = el.type === 'checkbox' ? el.checked : el.value; UI.sel.clear(); return d.ui === 'req' ? render() : renderResults(); }
  if (d.cset === 'stage') { const c = cur(); if (setStage(c, el.value)) { c.workdayStepChanged = false; if (el.value === 'rejected' && !c.rejectReason) c.rejectReason = 'Moved to rejected'; } return afterCandChange(); }
  if (d.cf) { const c = cur(); if (!c) return; const f = d.cf; let v = el.value.trim();
    if (f === 'tags') c.tags = v.split(',').map(x => x.trim()).filter(Boolean);
    else if (f === 'bookedAt') { c.bookedAt = v ? new Date(v).toISOString() : null; if (v) { log(c, 'booking', `Screen booked for ${fmtDateTime(c.bookedAt)}`); if (!c.inviteSentAt) c.inviteSentAt = nowIso(); if (c.stage === 'new') setStage(c, 'screen', 'screen booked'); } }
    else if (f === 'reqId') { log(c, 'req', `Req changed: ${c.reqId} → ${v}`); c.reqId = v; }
    else { if (f === 'name') { const sp = Parse.splitName(v); c.firstName = sp.first; c.lastName = sp.last; v = sp.full; } if (f === 'email') v = v.toLowerCase(); c[f] = v; }
    c.updatedAt = nowIso(); save(); UI._keepScroll = true; renderNav(); if (['pipeline', 'candidates'].includes(UI.view)) renderResults(); if (['bookedAt', 'reqId', 'name'].includes(f)) renderDrawer(); return; }
  if (d.rf) { const r = getReq(d.rid); if (!r) return; r[d.rf] = el.value.trim() || (d.rf === 'hmId' ? null : ''); save(); renderNav(); return; }
  if (d.hf) { const h = getHM(d.hid); if (!h) return; h[d.hf] = el.value.trim(); save(); return; }
  if (d.set) { S.settings[d.set] = el.type === 'number' ? Math.max(1, +el.value || 5) : el.value; save(); renderNav(); return; }
  if (d.setLines) { const v = el.value.split('\n').map(x => x.trim()).filter(Boolean); if (v.length) S.settings[d.setLines] = v; save(); return; }
  if (d.setBool) { S.settings[d.setBool] = el.checked; save(); return; }
  if (d.stageLabel) { const st = S.settings.stages.find(s => s.id === d.stageLabel); if (st && el.value.trim()) st.label = el.value.trim(); save(); return; }
  if (d.tf) { const t = S.templates.find(x => x.id === d.tid); if (t) { t[d.tf] = el.value; save(); } return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal-root').innerHTML) { if (UI.modal && UI.modal.type === 'confirm') UI.modal.res(false); closeModal(); } else if (UI.drawer) { UI.drawer = null; renderDrawer(); } else if (UI.sel.size) { UI.sel.clear(); renderResults(); } return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { const s = $('#search'); if (s) { e.preventDefault(); s.focus(); } }
});
/* drag & drop: board cards and import files */
document.addEventListener('dragstart', e => { const card = e.target.closest && e.target.closest('[data-card]'); if (!card) return; const id = card.dataset.card; const ids = UI.sel.has(id) ? [...UI.sel] : [id]; e.dataTransfer.setData('text/plain', 'td:' + ids.join(',')); e.dataTransfer.effectAllowed = 'move'; requestAnimationFrame(() => card.classList.add('dragging')); });
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => {
  const files = e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); if (files) { e.preventDefault(); const dz = e.target.closest && e.target.closest('#drop-zone'); $$('.drop-zone').forEach(x => x.classList.toggle('over', x === dz)); return; }
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col) return; e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop');
});
document.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); $$('.drop-zone').forEach(x => x.classList.remove('over')); if (UI.view === 'import' && (!UI.imp || UI.imp.step === 1)) handleImportFile(e.dataTransfer.files[0]); else toast('Go to Import from Workday to drop a file', 'err'); return; }
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col) return; e.preventDefault(); col.classList.remove('drop');
  const raw = e.dataTransfer.getData('text/plain') || ''; if (!raw.startsWith('td:')) return; moveMany(raw.slice(3).split(',').filter(Boolean), col.dataset.col);
});
/* chart tooltip */
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); const tip = $('#tip'); if (!t) { tip.classList.add('hidden'); return; } tip.textContent = t.dataset.tip; tip.classList.remove('hidden'); });
document.addEventListener('mousemove', e => { const tip = $('#tip'); if (tip.classList.contains('hidden')) return; tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist.flush(); });
window.addEventListener('beforeunload', () => persist.flush());
window.addEventListener('pagehide', () => { Store.releaseLock(); });

function openUnmatched(list) {
  UI.unmatched = list; UI.modal = { type: 'unmatched' };
  const opts = S.candidates.filter(isActive).sort((a, b) => candName(a).localeCompare(candName(b))).map(c => `<option value="${c.id}">${esc(candName(c))} · ${esc(c.reqId)} · ${esc(stageLabel(c.stage))}</option>`).join('');
  openModal('Bookings that didn\'t match a candidate', `<p class="sec small" style="margin-top:0">These people booked through Calendly with an email that isn't on any candidate (often a personal vs. work address). Link each one to the right candidate and TalentDesk will remember that address next time.</p>
    ${list.map((b, i) => `<div class="cand-line" style="flex-wrap:wrap"><div style="flex:1;min-width:220px"><div style="font-weight:600">${esc(b.name || b.email)}</div><div class="muted small">${esc(b.email)} · ${esc(fmtDateTime(b.start))}${b.title ? ' · ' + esc(b.title) : ''}</div></div><select class="input sm" id="ub-${i}" style="max-width:260px"><option value="">Link to candidate…</option>${opts}</select><button class="btn sm primary" data-act="assignBooking" data-i="${i}">Link</button><button class="btn sm ghost" data-act="ignoreBooking" data-i="${i}" title="Not a candidate. Don't show this address again">Ignore</button></div>`).join('')}`,
    `<button class="btn" data-act="closeModal">Done</button>`, true);
}
function chooseDataModal(r) {
  UI.modal = { type: 'choose' };
  openModal('This folder already has TalentDesk data', `<div class="stack"><p style="margin:0">The folder <b>“${esc(Store.folderName)}”</b> has <b>${plural(r.folderCount, 'candidate')}</b> (last saved ${esc(fmtDateTime(r.folderAt))}).<br>This browser has <b>${plural(S.candidates.length, 'candidate')}</b>.</p><p class="sec small" style="margin:0">Which one do you want to keep? If you replace the folder's data, a copy of it is saved in its backups folder first.</p></div>`,
    `<button class="btn" data-act="useLocalData">Replace with this browser's data</button><button class="btn primary" data-act="useFolderData">Use the folder's data</button>`);
}
function afterConnect(r) {
  UI.drawer = null; UI.sel.clear(); render();
  if (r.busy) return;
  toast(r.source === 'folder' ? `Loaded your data from “${Store.folderName}”` : `Saving to “${Store.folderName}” from now on`);
}
async function init() {
  if (/^https?:$/.test(location.protocol)) {
    const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
    if ('serviceWorker' in navigator && !window.__tdTestFolder) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  await DB.init();
  try { const st = await DB.loadState(); if (st) S = migrate(st) || defaultState(); } catch (e) { toast('Could not load saved data: ' + e.message, 'err'); }
  try { if ((await Store.init()) === 'ready') await Store.open('auto'); } catch (e) { toast('Could not open your data folder: ' + e.message, 'err'); }
  render();
  if (DB.mode === 'memory') toast("This browser is blocking storage for local files, so nothing will be saved. Open this file in Chrome or Edge.", 'err');
  if (UI.view === 'settings' && navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(x => { const el = $('#storage-est'); if (el) el.textContent = `Using ${(x.usage / 1048576).toFixed(1)} MB of browser storage.`; }).catch(() => { });
}
init();
</script>
</body>
